<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolve Já | Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..900&display=swap');
    </style>
</head>

<body class="body-começo">
    <main class="pagina">
        <!-- LADO DA LOGO -->
        <section class="lado-logo">
            <div class="logo-container">
                <img src="midia/Logo Branca.png" alt="Logo Resolve Já">
            </div>
            <div class="textologo">
                <p>✅ Profissionais Verificados</p>
                <p>✅ Atendimento Rapido</p>
                <p>✅ Perto de Você</p>
            </div>
        </section>
        <!-- LADO DO LOGIN -->
        <section class="lado-login">
            <div class="card-login">
                <h1 id="titulo">Entre ou Cadastre-se</h1>
                <!-- LOGIN -->
                <button type="submit" class="botao" onclick="window.location.href='entrar.html'">
                    Entrar
                </button>
                <!-- CADASTRO -->
                <button type="submit" class="botao" onclick="window.location.href='cadastro.html'">
                    Cadastrar
                </button>
                <div class="guia">
                    <h2>Guia Rápido</h2>
                    <div class="botoes-guia">
                        <button class="botao-guia" data-modal="politica" type="button">
                            <span class="icone">▱</span>
                            <span>Nossa Política</span>
                        </button>
                        <button class="botao-guia" data-modal="sobre" type="button">
                            <span class="icone">⌁</span>
                            <span>O que é</span>
                        </button>
                        <button class="botao-guia" data-modal="suporte" type="button">
                            <span class="icone">◌</span>
                            <span>Suporte</span>
                        </button>
                    </div>
                </div>
                <div class="seguranca">
                    ♧ &nbsp; Seus dados são protegidos
                </div>
            </div>
        </section>
    </main>

    <!-- JANELA DOS BOTÕES DO GUIA -->
    <div id="modal" class="modal">
        <div class="caixa-modal">
            <button id="fecharModal" class="fechar" type="button">
                ×
            </button>
            <h2 id="tituloModal"></h2>
            <p id="textoModal"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
